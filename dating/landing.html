<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="PENZI — a short cinematic welcome. Calligraphy, real photos, then the matchmaker.">
  <title>PENZI — Landing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Allura&family=Great+Vibes&family=IBM+Plex+Mono:wght@400;500&family=Outfit:wght@300;400;500;600&family=Parisienne&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/dating.css">
  <link rel="stylesheet" href="css/motion.css">
  <link rel="stylesheet" href="css/cine.css">
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      background: #e10600;
    }
    body.landing-page {
      overflow: hidden;
    }
    /* Keep landing self-contained — only the cine stage is visible */
    body.landing-page .toast { display: none !important; }
  </style>
</head>
<body class="landing-page is-intro">
  <!-- CINEMATIC LANDING (separate from home) -->
  <div class="cine" id="cineIntro" role="main" aria-label="PENZI landing">
    <div class="cine-stage" aria-hidden="true">
      <div class="cine-slide is-on" data-slide="0">
        <img src="https://images.unsplash.com/photo-1531123897727-8f129e1688ce?w=1600&q=80&auto=format&fit=crop" alt="">
      </div>
      <div class="cine-slide" data-slide="1">
        <img src="https://images.unsplash.com/photo-1522529599102-193c0d76b5b6?w=1600&q=80&auto=format&fit=crop" alt="">
      </div>
      <div class="cine-slide" data-slide="2">
        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=1600&q=80&auto=format&fit=crop" alt="">
      </div>
      <div class="cine-slide" data-slide="3">
        <img src="https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=1600&q=80&auto=format&fit=crop" alt="">
      </div>
      <div class="cine-veil"></div>
      <div class="cine-grain"></div>
      <div class="cine-frame geo-panel geo-panel--br"></div>
      <div class="cine-frame cine-frame--tr geo-panel geo-panel--tl"></div>
    </div>

    <div class="cine-copy">
      <p class="cine-kicker meta-label">Kenya · a short guide</p>

      <div class="cine-carve" id="cineCarve" aria-label="PENZI">
        <svg class="cine-carve-svg" viewBox="0 0 720 240" role="img" aria-labelledby="cineTitleLabel">
          <title id="cineTitleLabel">PENZI</title>
          <defs>
            <linearGradient id="graphiteInk" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#fffaf6"/>
              <stop offset="55%" stop-color="#f0e0cc"/>
              <stop offset="100%" stop-color="#cbb89a"/>
            </linearGradient>
            <filter id="carveDepth" x="-10%" y="-20%" width="120%" height="140%">
              <feDropShadow dx="0" dy="3" stdDeviation="1.4" flood-color="#100604" flood-opacity="0.55"/>
            </filter>
            <clipPath id="carveClip">
              <rect id="carveClipRect" x="0" y="0" width="0" height="240"/>
            </clipPath>
          </defs>

          <path class="carve-groove" d="M36 178 C160 198 340 204 500 182 C580 170 650 152 700 134" fill="none"/>

          <text class="carve-ghost" x="36" y="168" font-family="Great Vibes, Allura, cursive" font-size="168" fill="rgba(255,247,242,0.14)">PENZI</text>

          <g clip-path="url(#carveClip)" filter="url(#carveDepth)">
            <text class="carve-word" x="36" y="168" font-family="Great Vibes, Allura, cursive" font-size="168" fill="url(#graphiteInk)">PENZI</text>
            <text class="carve-word-stroke" x="36" y="168" font-family="Great Vibes, Allura, cursive" font-size="168" fill="none" stroke="rgba(255,250,244,0.35)" stroke-width="1.25">PENZI</text>
          </g>

          <path id="carvePath" class="carve-path" fill="none" d="
            M58 150
            C70 110 78 70 96 58
            C118 42 142 62 148 98
            C154 138 140 168 112 172
            C128 140 138 100 128 72
            C160 88 188 120 196 150
            C208 110 236 92 270 98
            C300 104 308 134 288 154
            C264 178 228 176 208 154
            C230 142 268 140 292 156
            C316 172 320 196 292 208
            C330 170 348 120 360 82
            C370 52 396 48 414 74
            C434 104 442 144 434 178
            C448 70 490 58 530 78
            C560 94 568 122 540 136
            C508 152 476 146 462 164
            C446 186 470 206 514 206
            C552 206 590 188 608 164
            C620 140 628 100 640 72
            C652 48 678 48 690 72
            C702 96 704 132 696 166
            C690 186 674 198 656 188
          "/>

          <g class="carve-dust" id="carveDust" aria-hidden="true"></g>

          <g class="carve-pencil" id="carvePencil" opacity="0">
            <g transform="rotate(-42) translate(-12 -96)">
              <rect x="6" y="12" width="15" height="66" rx="2.5" fill="#c9a56b"/>
              <rect x="8" y="14" width="4" height="62" fill="#ead7b0" opacity="0.7"/>
              <path d="M6 78 L13.5 102 L21 78 Z" fill="#6a5240"/>
              <path d="M9.5 84 L13.5 100 L17.5 84 Z" fill="#2a2420"/>
              <rect x="6" y="0" width="15" height="14" rx="1.5" fill="#e10600"/>
              <rect x="6" y="0" width="15" height="5" fill="#141414"/>
              <circle class="carve-spark" cx="13.5" cy="100" r="2.6" fill="#fff8f0"/>
            </g>
          </g>
        </svg>
        <p class="cine-carve-caption" id="cineCarveCaption">carved in calligraphy</p>
      </div>

      <p class="cine-script" id="cineScript">love, written slowly</p>
      <p class="cine-line" id="cineLine">Matchmaking for the Kenyan ecosystem.</p>

      <ol class="cine-steps" id="cineSteps" aria-live="polite">
        <li class="is-on" data-step="0"><span>01</span> Find your bond in the constellation</li>
        <li data-step="1"><span>02</span> Read stars, traits &amp; true plans</li>
        <li data-step="2"><span>03</span> Meet on the map — pay, go, belong</li>
      </ol>

      <div class="cine-actions">
        <button type="button" class="mx-split" id="cineEnter">
          <span>Enter PENZI</span><i aria-hidden="true">→</i>
        </button>
        <button type="button" class="text-link cine-skip" id="cineSkip">Skip</button>
      </div>
    </div>

    <div class="cine-progress" aria-hidden="true"><i id="cineBar"></i></div>
  </div>

  <script src="js/intro.js"></script>
</body>
</html>
